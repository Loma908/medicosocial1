# Apariencia general
colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true

# Información del autor (la barra lateral)
[author]
  name = "Juan Carlos"
  headline = "Médico"
  bio = "Escribo sobre medicina social y salud pública."
  links = [
    { github = "https://github.com/Loma908" }
  ]
  #image = "img/author.jpg" # Si tienes una foto, súbela a static/img/author.jpg

# Menú de navegación (los enlaces de arriba)
[[mainMenu]]
  name = "Inicio"
  pageRef = "/"
  weight = 10
[[mainMenu]]
  name = "Artículos"
  pageRef = "/posts"
  weight = 20
[[mainMenu]]
  name = "Sobre mí"
  pageRef = "/about"
  weight = 30

# Configuración del artículo (los posts)
[article]
  showDate = true
  showAuthor = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true

# Pie de página
[footer]
  showCopyright = true
  showThemeAttribution = true

# Homepage (la página de inicio)
[homepage]
  layout = "profile"
  showRecentPosts = true
  recentPostsLimit = 5
